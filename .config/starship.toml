"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$username$directory$git_branch$git_status$c$cpp$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context$conda$pixi$time$line_break$character
"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

# OS
[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = ' [ $symbol]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# Username
[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user  ]($style)'

# Directory
[directory]
style = "bg:color_yellow fg:color_fg0"
format = ' [ $path ]($style)'
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# Git
[git_branch]
symbol = ""
style = "bg:color_aqua fg:color_fg0"
format = ' [ $symbol $branch ]($style)'

[git_status]
style = "bg:color_aqua fg:color_fg0"
format = '[($all_status$ahead_behind )]($style)'

# Languages
[nodejs]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[c]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[cpp]
symbol = " "
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[php]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[java]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol( $version) ]($style)'

[python]
symbol = ""
style = "bg:color_blue fg:color_fg0"
format = ' [ $symbol($version ${virtualenv}) ]($style)'

# Docker / Conda / Pixi
[docker_context]
symbol = ""
style = "bg:color_bg3 fg:color_fg0"
format = ' [ $symbol( $context) ]($style)'

[conda]
style = "bg:color_bg3 fg:color_fg0"
format = ' [ $symbol( $environment) ]($style)'

[pixi]
style = "bg:color_bg3 fg:color_fg0"
format = ' [ $symbol( $version)( $environment) ]($style)'

# Time
[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1 fg:color_fg0"
format = ' [  $time ]($style)'

[line_break]
disabled = false

# Character
[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

